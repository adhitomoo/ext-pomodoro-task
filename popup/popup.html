<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      width: 540px;
      height: 440px;
      padding: 0;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 10px;
    }

    .header h1 {
      font-size: 18px;
      color: var(--text-dark);
      font-weight: 700;
    }

    .settings-btn {
      background: none;
      padding: 4px 8px;
      font-size: 18px;
      opacity: 0.6;
    }

    .settings-btn:hover {
      opacity: 1;
    }

    .main-layout {
      display: flex;
      height: calc(100% - 50px);
    }

    .task-panel {
      width: 55%;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .task-list::-webkit-scrollbar {
      width: 4px;
    }

    .task-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .task-group-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 4px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-light);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .source-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      margin-right: 4px;
    }

    .source-badge.notion {
      background: #E0D8F0;
      color: #6B5CA5;
    }

    .source-badge.clickup {
      background: #FFF0D4;
      color: #B8860B;
    }

    .source-badge.google {
      background: #D8E6FC;
      color: #1A73E8;
    }

    .error-banner {
      background: var(--danger);
      color: white;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
      border-left: 3px solid transparent;
      margin-bottom: 2px;
    }

    .task-row:hover {
      background: var(--primary-light);
    }

    .task-row.selected {
      background: var(--primary-light);
      border-left-color: var(--primary);
    }

    .task-row.done {
      opacity: 0.45;
      cursor: default;
    }

    .task-row.done:hover {
      background: transparent;
    }

    .task-row-name {
      flex: 1;
      font-size: 12.5px;
      color: var(--text-dark);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 6px;
    }

    .task-row.done .task-row-name {
      text-decoration: none;
    }

    .btn-mark-done-sm {
      background: var(--success);
      color: #2D5A3D;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .task-row:hover .btn-mark-done-sm {
      opacity: 1;
    }

    .toggle-done-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-light);
      cursor: pointer;
    }

    .toggle-done-row input {
      cursor: pointer;
    }

    .timer-panel {
      width: 45%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .timer-ring {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 8px;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
      width: 150px;
      height: 150px;
    }

    .timer-ring .bg-ring {
      fill: none;
      stroke: var(--border);
      stroke-width: 8;
    }

    .timer-ring .progress-ring {
      fill: none;
      stroke: url(#gradient);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .timer-display .time {
      font-size: 30px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 2px;
    }

    .timer-display .session-label {
      font-size: 11px;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .session-counter {
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 10px;
    }

    .session-dots {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-top: 4px;
    }

    .session-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
    }

    .session-dot.completed {
      background: var(--primary);
    }

    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .controls button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      padding: 0;
    }

    .btn-play {
      background: var(--primary);
      color: white;
    }

    .btn-play:hover {
      filter: brightness(0.9);
    }

    .btn-reset {
      background: var(--border);
      color: var(--text);
    }

    .btn-reset:hover {
      filter: brightness(0.9);
    }

    .btn-skip {
      background: var(--accent);
      color: white;
    }

    .btn-skip:hover {
      filter: brightness(0.9);
    }

    .selected-task-info {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      min-height: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .selected-task-name {
      font-weight: 600;
      color: var(--text-dark);
      font-size: 12px;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .no-setup {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-light);
      width: 100%;
    }

    .no-setup p {
      margin-bottom: 16px;
      font-size: 14px;
    }

    .empty-tasks {
      text-align: center;
      padding: 30px 12px;
      color: var(--text-light);
      font-size: 12px;
    }

    .task-count {
      font-size: 10px;
      color: var(--text-light);
      margin-left: auto;
    }

    .daily-stats {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      background: var(--primary-light);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pomodoro</h1>
    <button class="settings-btn" id="openSettings" title="Settings">&#9881;</button>
  </div>

  <div id="setupPrompt" class="no-setup" style="display: none;">
    <p>Connect your Notion workspace to get started.</p>
    <button class="btn-primary btn-small" id="goToSettings">Open Settings</button>
  </div>

  <div id="mainContent" class="main-layout" style="display: none;">
    <div class="task-panel">
      <div class="task-list" id="taskList">
        <div class="empty-tasks">Loading tasks...</div>
      </div>
      <label class="toggle-done-row">
        <input type="checkbox" id="hideDone" checked>
        Hide completed tasks
      </label>
    </div>

    <div class="timer-panel">
      <div class="timer-ring">
        <svg>
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #5C7AEA" />
              <stop offset="100%" style="stop-color: #45C4B0" />
            </linearGradient>
          </defs>
          <circle class="bg-ring" cx="75" cy="75" r="70"></circle>
          <circle class="progress-ring" id="progressRing" cx="75" cy="75" r="70"></circle>
        </svg>
        <div class="timer-display">
          <div class="time" id="timerTime">25:00</div>
          <div class="session-label" id="sessionLabel">Focus</div>
        </div>
      </div>

      <div class="session-counter">
        Session <span id="currentSessionNum">1</span> of <span id="totalSessions">4</span>
        <div class="session-dots" id="sessionDots"></div>
      </div>

      <div class="controls">
        <button class="btn-reset" id="btnReset" title="Reset">&#8634;</button>
        <button class="btn-play" id="btnPlay" title="Start">&#9654;</button>
        <button class="btn-skip" id="btnSkip" title="Skip">&#9197;</button>
      </div>

      <div class="selected-task-info" id="selectedTaskInfo">
        <span style="font-size:10px;">No task selected</span>
      </div>

      <div class="daily-stats" id="dailyStats"></div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
